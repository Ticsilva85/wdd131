<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD131 - Dynamic Web Fundamentals | W05 Assignment - Form</title>
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <script src="scripts/form.js" defer></script>
    <meta name="description" content="WDD 131 - Dynamic Web Fundamentals | W05 Assignment - Form">
    <meta name="author" content="Tiago Cavalcante da Silva">
</head>
<body>
    <header>
        <h1>Product Review</h1>
    
    </header>

    <main>
        <form method="get" action="review.html">
            <fieldset>
            <div>
                <label for="product">Product Name</label>
                <select name="product" id="product" required>
                    <option value="product1" disabled selected>Select a Product...</option>
                </select>
            </div>

            <div>
                <label>Overall Rating</label>
                <label for="onestar">★</label>
                <input type="radio" id="onestar" name="stars" value="1" required>

                <label for="twostar">★★</label>
                <input type="radio" id="twostar" name="stars" value="2">

                <label for="threestar">★★★</label>
                <input type="radio" id="threestar" name="stars" value="3">

                <label for="fourstar">★★★★</label>
                <input type="radio" id="fourstar" name="stars" value="4">

                <label for="fivestar">★★★★★</label>
                <input type="radio" id="fivestar" name="stars" value="5">
            </div>

            <div>
                <label for="installation-date">Date of installation</label>
                <input type="date" name="installation-date" id="installation-date" required>
            </div>

            <div>
                <label for="features">Which features did you find useful in the product? (Check all that apply)</label>
                <input type="checkbox" id="durability" name="features" value="durability">
                <label for="durability">Durability</label>
                <input type="checkbox" id="ease-of-use" name="features" value="ease-of-use">
                <label for="ease-of-use">Ease of Use</label>
                <input type="checkbox" id="performance" name="features" value="performance">
                <label for="performance">Performance</label>
                <input type="checkbox" id="design" name="features" value="design">
                <label for="design">Design</label>
            </div>

            <div>
                <label for="comments">Written Review</label>
                <textarea name="comments" id="comments" rows="5" cols="30" placeholder="Enter your comments here..."></textarea>
            </div>

            <div>
                <label for="yourname">Your Name</label>
                <input type="text" name="yourname" id="yourname">
            </div>

            <input type="submit" value="Post Review">
            </fieldset>
        </form>
    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span> 💻 Tiago Cavalcante da Silva 💻 Brazil</p>

        <p id="lastModified"></p>
    </footer>

</body>
</html>
